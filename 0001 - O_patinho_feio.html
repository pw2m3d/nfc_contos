xYKVLV/ufzZLqumQsA6XtFHVcdbWyNAKHaFk9JVna+17AEp/Epb3qnzJ6Yw9D13ZE39QCmq2oEJAAAA","alt":"Patinho cinza solitário num pântano ao entardecer.","caption":"Sozinho, ele segue em direção ao desconhecido."}],"paragraphs":["Ele passou por cercas, campos e árvores até chegar a um pântano cercado de juncos. Ali moravam patos selvagens, que o observaram com curiosidade.","— Quem é você? — perguntaram. O viajante abaixou a cabeça, educado. — Sou apenas alguém procurando um cantinho para descansar.","Alguns acharam suas penas diferentes, mas permitiram que ele ficasse entre as plantas. Durante duas noites, o patinho descansou ouvindo o vento passar pelo brejo.","Certa manhã, dois jovens gansos apareceram e o convidaram a conhecer outros lagos. O patinho quase sorriu: talvez sua jornada estivesse prestes a melhorar.","De repente, estrondos ecoaram do outro lado do pântano. Eram caçadores. As aves levantaram voo, e o lugar antes tranquilo se encheu de barulho e correria.","Um grande cão surgiu entre os juncos, parou diante do patinho, farejou-o e seguiu seu caminho. O pequeno permaneceu imóvel, assustado, até que o silêncio voltou.","Quando tudo se acalmou, ele respirou fundo. Tinha sobrevivido a mais uma situação difícil. Ainda tremia, mas não desistiria de procurar um lar."]}]},{"title":"A cabana e os novos caminhos","kicker":"Aprender a escolher o próprio rumo","intro":"Nem todo lugar que nos recebe é o lugar a que pertencemos.","beats":[{"images":[],"paragraphs":["Uma tempestade o surpreendeu enquanto atravessava o campo. O vento sacudia as árvores e a chuva parecia não ter fim. Já sem forças, o patinho avistou uma cabana antiga com a porta entreaberta.","Ele entrou por uma pequena fresta e encontrou um canto seco para dormir. Naquela casa viviam uma senhora, um gato que gostava de ronronar e uma galinha muito orgulhosa de seus ovos.","Quando o sol nasceu, os moradores descobriram o visitante. A senhora, que não enxergava tão bem, achou que talvez ele fosse uma pata e resolveu deixá-lo ficar algum tempo."]},{"images":[],"paragraphs":["O gato achava que não havia talento melhor do que ronronar e arquear as costas. A galinha tinha certeza de que botar ovos era a coisa mais importante do mundo.","— Você sabe botar ovos? — perguntou a galinha. — Não — respondeu o patinho.","— E ronronar? — quis saber o gato. — Também não.","Os dois concluíram depressa que o visitante ainda tinha muito a aprender. Mas o patinho conhecia uma alegria que eles nunca haviam experimentado: nadar livremente num lago."]},{"images":[],"paragraphs":["— Vocês já sentiram a água fresquinha passando pelas penas? — perguntou. — É maravilhoso mergulhar e depois voltar à superfície!","A galinha achou aquilo uma bobagem. O gato preferiu ficar junto ao fogão. Nenhum dos dois estava interessado em compreender o gosto do patinho.","Naquela tarde, um raio de sol entrou pela janela. O pequeno pensou na lagoa, no vento e no espaço aberto. A cabana era segura, mas seu coração pedia outro caminho.","— Agradeço o abrigo — disse com gentileza. — Preciso continuar minha viagem.","E assim partiu novamente. Descobrir seu lugar no mundo talvez levasse tempo, mas ele não queria deixar de ser quem era apenas para agradar aos outros."]}]},{"title":"Outono e inverno","kicker":"A esperança enfrenta o frio","intro":"Mesmo nas estações mais difíceis, a primavera continua existindo.","beats":[{"images":[],"paragraphs":["Os dias ficaram mais curtos. As árvores trocaram o verde por folhas amarelas e avermelhadas, e o vento anunciava o outono. O patinho encontrou um lago tranquilo, onde podia nadar sem ser incomodado.","Apesar da paz daquele lugar, ainda se sentia sozinho. Todas as noites olhava para o céu, imaginando se um dia encontraria outros animais com quem pudesse compartilhar suas descobertas."]},{"images":[{"src":"data:image/webp;base64,UklGRqJRAABXRUJQVlA4IJZRAADwKQGdASpUAQMBPkkejESioaEUemZQKASEppZVGXKOztu93X/lf4X0O+S+yH499+/x3vC/xOgT3b/heWZ7J/Uebj/a+q/9R+wb+vf7Ge4H/4eu3+6f+P1Y/1//l/u/7u35 function computeGeometry(){
 const freeH=Math.max(190,window.innerHeight-$('tocOpen').closest('.topbar').offsetHeight-document.querySelector('.controls').offsetHeight-27);
 const freeW=Math.max(230,window.innerWidth-34);

 if(doubleView){bookHeight=Math.min(freeH,Math.floor(freeW/1.47));bookWidth=Math.min(freeW,Math.round(bookHeight*1.47))}

function addParagraph(t,chapter){

  if(!activeModel || activeModel.chapter!==STORY.indexOf(chapter))newStoryPage(chapter);
  const make=(count)=>'<p class="prose '+(continuation?'cont':'')+'">'+linkify(remaining.slice(0,count).join(' '))+'</p>';
  const attempt=(n)=>{let element=document.createElement('p');element.className='prose '+(continuation?'cont':'');element.innerHTML=linkify(remaining.slice(0,n).join(' '));measureBody.appendChild(element);let fits=measureBody.scrollHeight<=measureBody.clientHeight+1;measureBody.removeChild(element);return fits};
  if(attempt(remaining.length)){addBlock(make(remaining.length),chapter);break}

function createBook(){
 let oldIndex=pageAtSpread(),relative=allPages.length?oldIndex/Math.max(1,allPages.length-1):0;
 computeGeometry();allPages=[];chapterStarts=[];specialStarts={};activeModel=null;
 if(!measure){measure=document.createElement('div');measure.style.cssText='position:fixed;left:-20000px;top:0;visibility:hidden;pointer-events:none;z-index:-1;';document.body.appendChild(measure)}
 const coverHTML='<div class="paper-inner"><div class="cover-eyebrow">PW2M 3D · Histórias Encantadas</div><h1 class="cover-title">O Patinho <em>Feio</em></h1><img class="cover-art" alt="Miniatura de livro antigo preto com ornamentos dourados O Patinho Feio" src="'+COVER+'"><p class="cover-author">Um conto de<br><strong>Hans Christian Andersen</strong></p><button class="cover-open" data-open="1" type="button">✦ Abrir o livro</button><div class="cover-note">Adaptação ilustrada para 7–12 anos · PW2M 3D</div></div>';
 addStatic('cover','Capa',coverHTML);
 const frontHTML='<div class="frontispiece"><div class="monogram">❦</div><span class="extra-kicker">Um livro para descobrir quem somos</span><h2>O Patinho Feio</h2><div class="divider"></div><p>Uma história sobre diferenças, coragem e pertencimento.</p><p><strong>Obra original:</strong> Hans Christian Andersen (1843).</p><p><strong>Esta edição:</strong> nova adaptação literária em português brasileiro para leitores de 7 a 12 anos, baseada no conto dinamarquês <em>Den grimme Ælling</em>.</p><p class="footnote">Texto adaptado, edição ilustrada e experiência digital: <strong>PW2M 3D</strong>.</p></div>';
 addStatic('front','Apresentação',frontHTML);
 STORY.forEach((chapter,i)=>{
  chapterStarts.push(allPages.length);newStoryPage(chapter);
  addBlock('<div class="chapter-title"><span class="chapter-num">CAPÍTULO '+String(i+1).padStart(2,'0')+' · '+esc(chapter.kicker)+'</span><h2>'+esc(chapter.title)+'</h2><p>'+esc(chapter.intro)+'</p></div>',chapter);
  chapter.beats.forEach(beat=>{
   beat.images.forEach(pic=>addBlock('<figure class="art-block"><img loading="eager" alt="'+esc(pic.alt)+'" src="'+pic.src+'"><figcaption>'+esc(pic.caption)+'</figcaption></figure>',chapter));
   beat.paragraphs.forEach(p=>addParagraph(p,chapter));
  });
 });
 specialStarts.licoes=allPages.length;
 addStatic('extra','O que fica da história','<div class="extra-kicker">Para guardar no coração</div><h2 class="extra-title">O que o patinho nos ensina?</h2><div class="lesson"><b>♡</b><div><h3>Respeito às diferenças</h3><p>Uma aparência diferente nunca é motivo para excluir ou zombar de alguém.</p></div></div><div class="lesson"><b>✦</b><div><h3>Coragem para continuar</h3><p>Mesmo quando um dia é difícil, o amanhã pode trazer novos encontros e oportunidades.</p></div></div><div class="lesson"><b>❀</b><div><h3>Ser quem somos</h3><p>Ninguém precisa conquistar valor pela beleza. Cada vida merece cuidado, amizade e acolhimento.</p></div></div>');
 specialStarts.jornada=allPages.length;
 addStatic('extra','Capítulos','<div class="extra-kicker">Relembre a jornada</div><h2 class="extra-title">Os seis capítulos</h2>'+STORY.map((c,i)=>'<button type="button" class="chapter-jump" data-jump="'+i+'"><span>'+String(i+1).padStart(2,'0')+'</span>'+esc(c.title)+'</button>').join(''));
 specialStarts.quiz=allPages.length;
 Q.forEach((q,i)=>addStatic('extra','Quiz · '+(i+1),'<div class="extra-kicker">Desafio de leitura · '+(i+1)+' de '+Q.length+'</div><h2 class="extra-title">Vamos relembrar a história?</h2><p class="prose">'+esc(q.q)+'</p>'+q.a.map((a,j)=>'<button type="button" class="quiz-choice" data-quiz="'+i+'" data-choice="'+j+'">'+String.fromCharCode(65+j)+'. '+esc(a)+'</button>').join('')+'<p class="quiz-note" data-feedback="'+i+'">Escolha uma resposta para ver como foi.</p>'));
 specialStarts.autor=allPages.length;
 addStatic('extra','Conheça o escritor','<div class="author-sheet"><span class="extra-kicker">CONHEÇA O ESCRITOR</span><h2>Hans Christian<br>Andersen</h2><div class="author-dates">1805–1875 · Dinamarca</div><div class="divider"></div><p>Hans Christian Andersen nasceu em Odense, na Dinamarca, em 2 de abril de 1805. Tornou-se um dos mais conhecidos escritores de contos de fadas, criando histórias como <em>O Patinho Feio</em>, <em>A Pequena Sereia</em>, <em>A Rainha da Neve</em> e <em>O Soldadinho de Chumbo</em>.</p><p>Suas histórias atravessaram gerações, convidando leitores a refletir sobre coragem, bondade, esperança e o valor de cada pessoa.</p><div class="author-reference"><small>Para conhecer mais sobre a vida e as obras do escritor:</small><a href="https://andersen.sdu.dk/" rel="noopener noreferrer" target="_blank">Centro de Estudos Hans Christian Andersen <span aria-hidden="true">↗</span></a></div><p class="author-credit">Obra de origem: <em>Den grimme Ælling</em> (1843).<br>Adaptação desta edição: PW2M 3D.</p></div>');
 specialStarts.logo=allPages.length;
 addStatic('brand','PW2M 3D','<div class="paper-inner"><div class="pw2m-signature"><img src="'+BRAND_OUTLINE+'" alt="Marca PW2M em linhas de contorno pretas"><div class="brand-name">PW2M 3D</div></div></div>');
 const wanted=Math.round(relative*(allPages.length-1));spread=spreadForPage(Math.min(allPages.length-1,wanted));
 render();populateToc();
}
function pageAtSpread(){return doubleView?Math.max(0,spread*2-1):spread}
function spreadForPage(index){return doubleView?Math.floor((index+1)/2):index}
function spreadCount(){return doubleView?Math.ceil((allPages.length+1)/2):allPages.length}
function makeRendered(index){
 if(index<0||index>=allPages.length){let node=paper({type:'blank'}).page;return node}
 const model=allPages[index];const ui=paper(model);
 if(model.type==='story')ui.body.innerHTML=model.blocks.join('');
 else if(model.type==='cover'||model.type==='brand')ui.page.innerHTML=model.html;
 else ui.body.innerHTML=model.html;
 const foot=ui.page.querySelector('.page-number');if(foot)foot.textContent=String(index+1).padStart(2,'0');
 return ui.page;
}
function render(){
 const pages=spreadCount();spread=Math.min(Math.max(spread,0),pages-1);
 let activeIndex;
 if(doubleView){left.style.display='';right.style.display=''; const leftIndex=spread*2-1,rightIndex=spread*2;left.replaceChildren(makeRendered(leftIndex));right.replaceChildren(makeRendered(rightIndex));activeIndex=rightIndex<allPages.length?rightIndex:leftIndex}
 else{left.style.display='none';right.style.display='';right.replaceChildren(makeRendered(spread));activeIndex=spread}
 const cur=allPages[Math.max(0,activeIndex)]||{label:'Capa'};
 $('progressTitle').textContent=cur.label;$('progressText').textContent=doubleView?'Folhas '+Math.max(1,spread*2)+'–'+Math.min(allPages.length,spread*2+1)+' de '+allPages.length:'Página '+(activeIndex+1)+' de '+allPages.length;
 $('barProgress').style.width=((spread+1)/pages*100)+'%';$('prevPage').disabled=spread===0;$('nextPage').disabled=spread>=pages-1;
 document.querySelectorAll('[data-quiz]').forEach(el=>{let q=Number(el.dataset.quiz),sel=quizChoice[q];if(sel!==undefined){el.disabled=true;if(Number(el.dataset.choice)===Q[q].right)el.classList.add('right');else if(Number(el.dataset.choice)===sel)el.classList.add('wrong')}});
 document.querySelectorAll('[data-feedback]').forEach(el=>{let i=Number(el.dataset.feedback),sel=quizChoice[i];if(sel!==undefined)el.textContent=(sel===Q[i].right?'✓ Correto! ':'✦ Quase! ')+Q[i].note});
}
function gotoPage(i){stopSpeaking();spread=spreadForPage(Math.min(Math.max(0,i),allPages.length-1));render()}
function turn(delta){if(spread+delta>=0&&spread+delta<spreadCount()){stopSpeaking();spread+=delta;render()}}
function populateToc(){const l=$('tocList');l.innerHTML='<button type="button" data-index="0"><small>✦</small>Capa</button><button type="button" data-index="1"><small>00</small>Apresentação</button>'+STORY.map((c,i)=>'<button type="button" data-index="'+chapterStarts[i]+'"><small>'+String(i+1).padStart(2,'0')+'</small>'+esc(c.title)+'</button>').join('')+'<button type="button" data-index="'+specialStarts.licoes+'"><small>✧</small>Lições</button><button type="button" data-index="'+specialStarts.quiz+'"><small>?</small>Quiz</button><button type="button" data-index="'+specialStarts.autor+'"><small>✧</small>Conheça o escritor</button><button type="button" data-index="'+specialStarts.logo+'"><small>✦</small>PW2M 3D</button>'}
function toggleToc(open){$('tocBackdrop').classList.toggle('open',open);if(open)$('tocClose').focus()}
$('tocOpen').addEventListener('click',()=>toggleToc(true));$('tocClose').addEventListener('click',()=>toggleToc(false));$('tocBackdrop').addEventListener('click',e=>{if(e.target===$('tocBackdrop'))toggleToc(false)});
$('tocList').addEventListener('click',e=>{let b=e.target.closest('[data-index]');if(b){toggleToc(false);gotoPage(Number(b.dataset.index))}});
$('prevPage').addEventListener('click',()=>turn(-1));$('nextPage').addEventListener('click',()=>turn(1));
book.addEventListener('click',e=>{let el=e.target.closest('a,button');if(el){if(el.dataset.open||el.dataset.first){gotoPage(el.dataset.first?0:1)}else if(el.dataset.jump!==undefined)gotoPage(chapterStarts[Number(el.dataset.jump)]);else if(el.dataset.quiz!==undefined){const q=Number(el.dataset.quiz);if(quizChoice[q]===undefined){quizChoice[q]=Number(el.dataset.choice);render()}}return}
 const r=book.getBoundingClientRect();if(e.clientX-r.left>r.width*.7)turn(1);else if(e.clientX-r.left<r.width*.3)turn(-1)});
let x0=0,y0=0,t0=0,skipClick=false;
book.addEventListener('touchstart',e=>{if(e.touches.length===1){x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now()}},{passive:true});
book.addEventListener('touchend',e=>{if(!e.changedTouches.length)return;let dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.2){e.preventDefault();turn(dx<0?1:-1)}},{passive:false});
document.addEventListener('keydown',e=>{if($('tocBackdrop').classList.contains('open')){if(e.key==='Escape')toggleToc(false);return}if(['ArrowRight','PageDown',' '].includes(e.key)&&!e.target.matches('a,button,input')){e.preventDefault();turn(1)}else if(['ArrowLeft','PageUp'].includes(e.key)&&!e.target.matches('a,button,input')){e.preventDefault();turn(-1)}else if(e.key==='Home'){e.preventDefault();gotoPage(0)}else if(e.key==='End'){e.preventDefault();gotoPage(allPages.length-1)}});
function fontChange(n){fontScale=Math.max(.82,Math.min(1.34,Math.round((fontScale+n)*100)/100));document.documentElement.style.setProperty('--font-scale',fontScale);let chapter=allPages[pageAtSpread()]?.chapter;createBook();if(chapter!==undefined&&chapterStarts[chapter]!==undefined)gotoPage(chapterStarts[chapter])}
$('fontLess').addEventListener('click',()=>fontChange(-.08));$('fontMore').addEventListener('click',()=>fontChange(.08));
$('themeToggle').addEventListener('click',()=>{document.body.classList.toggle('night');$('themeToggle').textContent=document.body.classList.contains('night')?'☀':'☾';const keep=pageAtSpread();createBook();gotoPage(Math.min(allPages.length-1,keep))});
function stopSpeaking(){if('speechSynthesis' in window){window.speechSynthesis.cancel()}spoken=false;$('sayPage').textContent='♫'}
$('sayPage').addEventListener('click',()=>{if(!('speechSynthesis' in window)){alert('A leitura em voz alta não está disponível neste navegador.');return}if(spoken){stopSpeaking();return}const current=doubleView?Array.from(book.querySelectorAll('.page-body')):Array.from(right.querySelectorAll('.page-body'));const text=current.map(el=>el.innerText).join(' ').trim();if(!text)return;let u=new SpeechSynthesisUtterance(text);u.lang='pt-BR';u.rate=.94;u.onend=()=>{spoken=false;$('sayPage').textContent='♫'};u.onerror=()=>{spoken=false;$('sayPage').textContent='♫'};spoken=true;$('sayPage').textContent='■';window.speechSynthesis.speak(u)});
let resizeWait;window.addEventListener('resize',()=>{clearTimeout(resizeWait);resizeWait=setTimeout(createBook,160)});
createBook();
