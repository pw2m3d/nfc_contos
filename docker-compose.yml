services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: nfc_contos
      POSTGRES_USER: nfc
      POSTGRES_PASSWORD: nfc
    ports:
      - "5432:5432"
    volumes:
      - nfc_contos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfc -d nfc_contos"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  nfc_contos_pg:
